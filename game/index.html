<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081429"><title>Captain Suji – Black Hole Challenge V6 – updated</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"></head><body>
<div id="start" class="screen"><div class="welcome"><div class="eyebrow">THE ADVENTURES OF CAPTAIN SUJI • V6 UPDATED</div><h1>Captain Suji<br><span>Black Hole Challenge</span></h1><img class="heroShip" src="ship.png" alt="Gold and black Swift Comet SC-01 spaceship"><p>Help the Swift Comet fly past a black hole and reach Kip's blue planet!</p><div class="levelButtons"><button data-level="cadet"><b>🌟 Space Cadet</b><small>Move up or down</small></button><button data-level="pilot"><b>🚀 Space Pilot</b><small>Move up or down – trickier black hole</small></button><button data-level="commander"><b>🌌 Space Commander</b><small>Pull back to aim and launch</small></button></div><div class="startActions"><button id="discoveries">📚 My Discoveries</button><button class="mute">🔊 Sound on</button></div></div></div>
<div id="game" class="screen hidden"><header><button id="back">← Back to start</button><strong id="levelName">SPACE CADET</strong><div class="headerActions"><button id="restart">↻ Restart</button><button class="mute">🔊 Sound on</button></div></header><main id="arena"><canvas id="scene" aria-label="Swift Comet flight scene with black hole and Kip's planet"></canvas><img id="ship" src="ship.png" alt="Swift Comet SC-01" draggable="false"><div id="meter" class="meter"><canvas id="gauge" width="240" height="135" aria-label="Gravity meter"></canvas><div id="meterText">Move the ship to see gravity</div></div><div class="bars"><label>Gravity pull <span class="bar"><i id="gravityBar"></i></span></label><label>Speed <span class="bar"><i id="speedBar"></i></span></label></div><div id="hintButtonWrap" class="hidden"><button id="askOrbit">Ask ORBIT <span id="hintsLeft">3</span></button></div><div id="orbitBox"><b>ORBIT</b> <span id="orbit">Choose a launch spot, Captain!</span></div><div id="touchHint">Drag SC-01 up or down.</div></main><footer><div id="status" role="status">Move SC-01 to get ready.</div><button id="launch" disabled>🚀 LAUNCH</button></footer></div>
<div id="result" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="panel"><h2 id="resultTitle"></h2><p id="resultReason"></p><p class="fact" id="resultFact"></p><div class="actions"><button id="tryAgain">↻ Try again</button><button id="resultBack">← Back to start</button></div></div></div>
<div id="cards" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="cardsTitle"><div class="panel cardsPanel"><h2 id="cardsTitle">My Discoveries</h2><div id="cardList" class="cardList"></div><button id="cardsBack">← Back</button></div></div>
<script src="engine.js"></script><script src="game.js"></script></body></html>
